name: UX v2 Phase 1 assemble
on:
  push:
    branches: [ux-v2-phase1-final]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-phase1-final
      - name: Assemble presentation layer
        run: |
          cat .uxv2/chunk1.txt .uxv2/chunk2.txt .uxv2/chunk3.txt .uxv2/chunk4.txt > assets/ux-v2-phase1.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/ux-v2-phase1.css">'
          js='<script src="assets/ux-v2-phase1.js"></script>'
          if css not in s: s=s.replace('</head>','  '+css+'\n</head>',1)
          if js not in s: s=s.replace('</body>','  '+js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf .uxv2
      - name: Commit assembled preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ux-v2-phase1.js .uxv2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assemble LEMMA UX v2 Phase 1 preview"
          git push origin HEAD:ux-v2-phase1-final
