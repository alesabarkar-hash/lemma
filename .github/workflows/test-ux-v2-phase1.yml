name: Test UX v2 Phase 1
on:
  push:
    branches: [ux-v2-phase1-lite]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          s=s.replace('</head>','<link rel="stylesheet" href="assets/ux-v2-phase1.css">\n</head>',1)
          s=s.replace('</body>','<script src="assets/ux-v2-core.js"></script><script src="assets/ux-v2-book.js"></script><script src="assets/ux-v2-ui1.js"></script><script src="assets/ux-v2-ui2.js"></script>\n</body>',1)
          p.write_text(s)
          PY
      - name: Syntax checks
        run: |
          node --check assets/ux-v2-core.js
          node --check assets/ux-v2-book.js
          node --check assets/ux-v2-ui1.js
          node --check assets/ux-v2-ui2.js
          grep -q 'ux-v2-phase1.css' index.html
